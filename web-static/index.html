<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Sentimen Pilkada DKI 2024</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="container">
    <section class="hero card">
      <h1>Dashboard Sentimen Instagram</h1>
      <p>Analitik percakapan publik konten kampanye Pilkada DKI Jakarta 2024.</p>
    </section>

    <section class="grid4" id="metrics"></section>

    <section class="grid2">
      <article class="card"><h3>Distribusi Sentimen</h3><canvas id="sentimentChart"></canvas></article>
      <article class="card"><h3>Komentar per Post Date</h3><canvas id="postDateChart"></canvas></article>
    </section>

    <section class="card">
      <h3>Komentar Terbaru (Sample)</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Post Date</th><th>Created At</th><th>Username</th><th>Komentar</th><th>Sentimen</th><th>Skor</th></tr></thead>
          <tbody id="commentRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="./main.js"></script>
</body>
</html>
